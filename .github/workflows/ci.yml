name: CI

# Lints and tests drivine on each Python it supports, and again with Oracle, each run split over parallel jobs with
# containers of their own: `pytest --shard i/n` runs one part, a module whole in one part (tests/shards.py).
#
# A pull request's run takes the database suite on Python 3.11 and 3.14 alone, and tests/unit on 3.12 and 3.13; a full
# run takes it on all four. A pull request's run also leaves out the nightly tests (`-m nightly`, the tests marked so): slow ones, and ones that rest
# on a timing or a plan. A full run has them too, in a part of their own: a push to main, a pull request labelled
# `full-ci`, nightly.yml each night, and release.yml's gate. release.yml calls this as the gate before a release,
# unless a full push or pull_request run of it has already passed on the same tree.
on:
  push:
    branches: [main]
  pull_request:
    # As the default, and labeled, so that labelling a pull request `full-ci` runs the full set on it.
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
    inputs:
      full:
        description: Run the nightly tests too, as a release and the nightly do.
        type: boolean
        default: false

# A pull request's newer run, of a later push or a label, takes the place of the one still going. Any other run, and
# this workflow called by another, is a group of its own.
concurrency:
  group: ${{ github.workflow == 'CI' && github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

# FalkorDB is held at a release that passes: a pull request's run takes falkordb/falkordb:6.0.3. The nightly run
# (nightly.yml, whose name this sees as its workflow) takes ghcr.io/falkordb/falkordb:latest, FalkorDB's newest release,
# and not the falkordb/falkordb:latest the plugin names: Docker Hub's latest is whichever release FalkorDB pushed last,
# and that can be an older line's backport, as v4.22.3 took it after 6.0.3 (no =~, and no pattern comprehension in a
# function, FalkorDB/FalkorDB#3551). Drop the nightly's ghcr.io image once Docker Hub's latest follows FalkorDB's newest
# line again; move the pin, or drop it, once the nightly passes.
env:
  FALKORDB_TEST_IMAGE: ${{ github.workflow == 'Nightly' && 'ghcr.io/falkordb/falkordb:latest' || 'falkordb/falkordb:6.0.3' }}

jobs:
  # Records the git tree this run tests, as an artifact named ci-tree-<tree>, so a release of the same tree can trust
  # this run and skip its gate (scripts/ci_trust.py). It matters on a pull request, which tests its merge ref, not the
  # head commit the run names. A run of the pull request set alone, without the nightly tests, names it
  # ci-tree-pr-set-<tree>, which a release doesn't trust. It has no condition, as no job here may: release.yml trusts
  # a run only when every job in it passed, and a job skipped by a condition doesn't.
  tree:
    name: record the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tree
        id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree $(git rev-parse HEAD)" > ci-tree.txt
          echo "This run tests tree $tree, of commit $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
      # Overwritten when the run is re-run, as an artifact's name is unique within a run.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-tree-${{ !(inputs.full || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'pr-set-' || '' }}${{ steps.tree.outputs.tree }}
          path: ci-tree.txt
          if-no-files-found: error
          overwrite: true

  # The Cypher spec's copies in tests/cypher are the tag tests/cypher/VERSION names, unchanged, and a later tag is
  # shown as a warning. The script reads the standard library alone, so nothing is installed for it.
  cypher-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check the Cypher spec
        run: python scripts/check_cypher_spec.py

  # How long `import drivine` and compiling Cypher to SQL take, on one Python, so runs compare. The job fails where the
  # least of at least 7 fresh imports is worse by more than 10% than main's, timed in turn on the same runner (#496),
  # or where a first compile's median, or an uncached compile's median or p99, is worse by more than 10% than the
  # baseline of the compiler Drivine had before the shared one (tests/bench/compile-baseline.json, #467's CI run; its
  # import is printed for reference only). It records them in the run's summary and as an artifact.
  compile-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      # main, beside this tree in an environment of its own, whose import is timed in turn with this tree's on the one
      # runner: a runner's CPU type moved import by a quarter where the code didn't (#496).
      - name: Check out main to time its import beside this tree's
        run: |
          git fetch --depth 1 origin main
          git worktree add ../main-tree FETCH_HEAD
          (cd ../main-tree && uv sync)
      - name: Time import and compile
        # bash by name runs with pipefail, so a failing bench fails the step through the tee.
        shell: bash
        run: uv run python scripts/compile_bench.py --json compile-bench.json --against tests/bench/compile-baseline.json --import-against ../main-tree | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: compile-bench
          path: compile-bench.json
          if-no-files-found: error
          overwrite: true

  # Every test but Oracle's, in three parts, and the nightly tests in a fourth: on each Python on a full run (picked by
  # the same test as `tree`'s record). A pull request's run takes the database suite on the oldest and the newest
  # Python alone, 3.11 and 3.14, in the three parts, which hold every test but the nightly ones once; on 3.12 and 3.13
  # it runs tests/unit alone, which needs no database, with no containers. The first part, or the unit part, lints too.
  test:
    name: test (${{ matrix.python }}, ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.full || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '[{"python":"3.11","part":"1/3"},{"python":"3.11","part":"2/3"},{"python":"3.11","part":"3/3"},{"python":"3.11","part":"nightly"},{"python":"3.12","part":"1/3"},{"python":"3.12","part":"2/3"},{"python":"3.12","part":"3/3"},{"python":"3.12","part":"nightly"},{"python":"3.13","part":"1/3"},{"python":"3.13","part":"2/3"},{"python":"3.13","part":"3/3"},{"python":"3.13","part":"nightly"},{"python":"3.14","part":"1/3"},{"python":"3.14","part":"2/3"},{"python":"3.14","part":"3/3"},{"python":"3.14","part":"nightly"}]' || '[{"python":"3.11","part":"1/3"},{"python":"3.11","part":"2/3"},{"python":"3.11","part":"3/3"},{"python":"3.14","part":"1/3"},{"python":"3.14","part":"2/3"},{"python":"3.14","part":"3/3"},{"python":"3.12","part":"unit"},{"python":"3.13","part":"unit"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - if: matrix.part == '1/3' || matrix.part == 'unit'
        run: uv run ruff check .
      - if: matrix.part == '1/3' || matrix.part == 'unit'
        run: uv run ruff format --check .
      - if: matrix.part == '1/3' || matrix.part == 'unit'
        run: uv run pyright
      - if: matrix.part == '1/3' || matrix.part == 'unit'
        run: uv run python scripts/unasync.py --check
      - name: Run the tests
        env:
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            nightly) picked=(-m nightly) ;;
            unit) picked=(-o drivine_test_containers=false tests/unit) ;;
            *) picked=(-m "not nightly" --shard "$PART") ;;
          esac
          uv run pytest -q --durations=15 --record-durations durations.json "${picked[@]}"
      # How long each module took, to balance the parts by (tests/durations.json). From the slowest Python alone.
      - if: always() && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: durations-default-${{ strategy.job-index }}
          path: durations.json
          if-no-files-found: ignore
          overwrite: true

  # What Oracle adds, on the newest Python alone, with ORACLE_TESTS=true: the tests whose name or parameters say oracle,
  # which `-k oracle` picks. In four parts, and the nightly ones in a fifth on a full run.
  oracle-part:
    name: test (Oracle, ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON((inputs.full || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["1/4", "2/4", "3/4", "4/4", "nightly"]' || '["1/4", "2/4", "3/4", "4/4"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      # Pulled here, so that the time the image takes isn't counted against the container's start. The image is the
      # one drivine/testing/drivine_test_containers.py names.
      - name: Pull the Oracle image
        run: docker pull gvenzl/oracle-free:23-faststart
      - run: uv sync
      - name: Run the Oracle tests
        env:
          ORACLE_TESTS: "true"
          PART: ${{ matrix.part }}
        run: |
          if [ "$PART" = nightly ]; then picked=(-m nightly); else picked=(-m "not nightly" --shard "$PART"); fi
          uv run pytest -q -k oracle --durations=15 --record-durations durations.json "${picked[@]}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-oracle-${{ strategy.job-index }}
          path: durations.json
          if-no-files-found: ignore
          overwrite: true

  # The check the single Oracle job gave before it was split: it passes when every part with Oracle passed. It runs
  # whatever they concluded, as no job here may be skipped (see `tree`).
  oracle:
    name: test (Oracle)
    needs: oracle-part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: |
          echo "The parts with Oracle concluded ${{ needs.oracle-part.result }}."
          [ "${{ needs.oracle-part.result }}" = success ]
