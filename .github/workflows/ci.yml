name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run python scripts/unasync.py --check
      - run: uv run pytest -q

  # Oracle is left out of the job above: its tests run only with ORACLE_TESTS=true. This job runs what Oracle adds,
  # on the newest Python alone: the tests whose name or parameters say oracle, which `-k oracle` picks.
  test-oracle:
    name: test (Oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      # The Oracle image takes about six gigabytes unpacked, beside the other engines' images.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # Pulled here, so that the time the image takes isn't counted against the container's start. The image is the
      # one drivine/testing/drivine_test_containers.py names.
      - name: Pull the Oracle image
        run: docker pull gvenzl/oracle-free:23-faststart
      - run: uv sync
      - name: Run the Oracle tests
        run: uv run pytest -q -k oracle
        env:
          ORACLE_TESTS: "true"
