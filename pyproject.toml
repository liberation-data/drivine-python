[project]
name = "drivine"
version = "0.6.1"
description = "Graph database client for Python: Neo4j, Memgraph, FalkorDB, Neptune, Oracle, Postgres and SQLite."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Liberation Data" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pi-pilgrim>=0.4.0,<0.5",
]
keywords = ["graph", "database", "neo4j", "memgraph", "falkordb", "neptune", "oracle", "postgres", "sqlite", "cypher", "ogm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]
# pi-pilgrim is a core dependency now; the extra is kept so that `pip install "drivine[pilgrim]"` still works.
pilgrim = []
testing = ["testcontainers>=4.8", "pytest>=8"]
falkordb = [
    "falkordb>=1.2",
]
# The compiler Drivine had before the shared one (drivine/cypher/sql), which no connection calls now, parses with ANTLR's
# runtime, of the version its parser was generated by (scripts/cypher_grammar.py): kept until it goes (#471, stage 3).
oracle = [
    "oracledb>=3.0",
    "antlr4-python3-runtime>=4.13.2,<4.14",
]
postgres = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "antlr4-python3-runtime>=4.13.2,<4.14",
]
# SQLite is apsw's, which bundles its own SQLite: 3.53.2 or later, which writes a float as text to 17 significant
# digits as compiled Cypher needs (3.53.0 and 3.53.1 still write 15), whatever SQLite Python was built with (#376).
sqlite = [
    "apsw>=3.53.2",
    "antlr4-python3-runtime>=4.13.2,<4.14",
]

[project.entry-points.pytest11]
drivine = "drivine.testing.plugin"

[project.urls]
Homepage = "https://drivine.org"
Repository = "https://github.com/liberation-data/drivine-python"

[dependency-groups]
dev = [
    "drivine[neo4j,falkordb,oracle,postgres,sqlite,pilgrim,testing]",
    "pytest-asyncio>=0.24",
    "pyyaml>=6",
    "pyright>=1.1.380",
    "ruff>=0.6",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drivine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
drivine_test_containers = true
markers = [
    "rolls_back: needs multi-statement transactions, which FalkorDB lacks",
    "written_in_cypher: seeds and reads back in Cypher, which Postgres, Oracle and SQLite compile to their SQL",
    "graph_engine_only(reason): runs what Postgres, Oracle and SQLite don't take, as the reason says",
    "fails_on_sql_stores(reason): fails on Postgres, Oracle and SQLite for the issue the reason names; xfail there, strictly",
    "async_only: runs tasks concurrently; left out of the sync tests scripts/unasync.py writes",
    "nightly: slow, or rests on a timing or a plan; a pull request's CI leaves it out, and the nightly, a push to main, a release and a PR labelled full-ci run it",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# The Cypher compiler's parser is ANTLR's, written by scripts/cypher_grammar.py.
extend-exclude = ["*.md", "drivine/cypher/grammar"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The PL/SQL prelude is TypeScript's Drivine's, line for line, so that the two write the same statements.
"drivine/backend/oracle/oracle_save_builder.py" = ["E501"]
# drivine4j's block that makes a Postgres store, line for line, as scripts/postgres_store.py writes it.
"drivine/backend/postgres/postgres_store_text.py" = ["E501"]
# The function an Oracle graph is made with, drivine4j's line for line, as part of the store layout.
"drivine/backend/oracle/oracle_stored_functions.py" = ["E501"]

[tool.pyright]
include = ["drivine"]
exclude = ["drivine/cypher/grammar"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportPrivateUsage = false
