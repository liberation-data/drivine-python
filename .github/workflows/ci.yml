name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this as its gate, so that a release passes the same CI as a pull request, unless a push or
  # pull_request run of it has already passed on the same tree.
  workflow_call:
  # Each night on the latest images, without the pin below, so an engine's new release shows up here and not in a pull
  # request's run.
  schedule:
    - cron: "17 4 * * *"

# FalkorDB is held at a release that passes: a pull request's run takes falkordb/falkordb:6.0.3. The nightly run takes
# ghcr.io/falkordb/falkordb:latest, FalkorDB's newest release, and not the falkordb/falkordb:latest the plugin names:
# Docker Hub's latest is whichever release FalkorDB pushed last, and that can be an older line's backport, as v4.22.3
# took it after 6.0.3 (no =~, and no pattern comprehension in a function, FalkorDB/FalkorDB#3551). Drop the nightly's
# ghcr.io image once Docker Hub's latest follows FalkorDB's newest line again; move the pin, or drop it, once the
# nightly passes.
env:
  FALKORDB_TEST_IMAGE: ${{ github.event_name == 'schedule' && 'ghcr.io/falkordb/falkordb:latest' || 'falkordb/falkordb:6.0.3' }}

jobs:
  # Records the git tree this run tests, as an artifact named ci-tree-<tree>, so a release of the same tree can trust
  # this run and skip its gate (scripts/ci_trust.py). It matters on a pull request, which tests its merge ref, not the
  # head commit the run names. It has no condition, as no job here may: release.yml trusts a run only when every job
  # in it passed, and a job skipped by a condition doesn't.
  tree:
    name: record the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tree
        id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree $(git rev-parse HEAD)" > ci-tree.txt
          echo "This run tests tree $tree, of commit $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
      # Overwritten when the run is re-run, as an artifact's name is unique within a run.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-tree-${{ steps.tree.outputs.tree }}
          path: ci-tree.txt
          if-no-files-found: error
          overwrite: true

  # The Cypher spec's copies in tests/cypher are the tag tests/cypher/VERSION names, unchanged, and a later tag is
  # shown as a warning. The script reads the standard library alone, so nothing is installed for it.
  cypher-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check the Cypher spec
        run: python scripts/check_cypher_spec.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run python scripts/unasync.py --check
      - run: uv run pytest -q

  # Oracle is left out of the job above: its tests run only with ORACLE_TESTS=true. This job runs what Oracle adds,
  # on the newest Python alone: the tests whose name or parameters say oracle, which `-k oracle` picks.
  test-oracle:
    name: test (Oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      # Pulled here, so that the time the image takes isn't counted against the container's start. The image is the
      # one drivine/testing/drivine_test_containers.py names.
      - name: Pull the Oracle image
        run: docker pull gvenzl/oracle-free:23-faststart
      - run: uv sync
      - name: Run the Oracle tests
        run: uv run pytest -q -k oracle
        env:
          ORACLE_TESTS: "true"
