# Releases drivine to PyPI. RELEASING.md describes the process.
#
# - A push to main that raises pyproject.toml's version (the merge of a "Release vX.Y.Z" PR) publishes it, and tags
#   the commit vX.Y.Z. A push to main that changes pyproject.toml without raising the version publishes nothing.
# - A push of a tag vX.Y.Z, by hand, publishes too: the fallback.
# - Either way, the full CI runs, the distributions are built and checked, and those exact files are uploaded to PyPI
#   with trusted publishing.
# - workflow_dispatch, and a pull request that changes the release machinery, are dry runs: everything but the
#   publish, with the built files left as the run's artifact to inspect.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A push to main runs this only when it changes the version's file. GitHub doesn't apply paths to a tag push.
    paths:
      - pyproject.toml
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - RELEASING.md
      - pyproject.toml
      - scripts/smoke_wheel.py
      - scripts/release_version.py

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Work out the version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          declared=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::The tag $tag isn't vX.Y.Z (or vX.Y.Z-suffix). Delete it and tag the release commit vX.Y.Z."
              exit 1
            fi
            version="${tag#v}"
            if [[ "$version" != "$declared" ]]; then
              echo "::error::The tag $tag is version $version, but pyproject.toml's version is $declared. Tag the commit whose version is $version, or bump pyproject.toml in a release PR first."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
              echo "::error::The tag $tag is on $GITHUB_SHA, which isn't on $DEFAULT_BRANCH. Tag the release PR's merge commit on $DEFAULT_BRANCH."
              exit 1
            fi
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # A push to main that changed pyproject.toml. It releases the version when that is a new one, greater than
            # the newest vX.Y.Z tag; github-release then makes the tag.
            version="$declared"
            tag="v$version"
            newest=$(git tag -l 'v*' | python3 scripts/release_version.py newest)
            publish=false
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::notice::pyproject.toml's version $version isn't X.Y.Z (or X.Y.Z-suffix), so this push releases nothing."
            elif git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::notice::The tag $tag already exists, so this push, which changed pyproject.toml but not to a new version, releases nothing."
            elif [[ -n "$newest" ]] && ! python3 scripts/release_version.py greater "$version" "${newest#v}"; then
              echo "::notice::pyproject.toml's version $version isn't greater than the newest tag, $newest, so this push releases nothing."
            else
              publish=true
            fi
          else
            version="$declared"
            tag="v$version"
            publish=false
          fi
          echo "Version $version, publish: $publish"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The full CI, as ci.yml runs it on a push or a pull request. A push that releases nothing stops at check: ci.yml
  # runs on the same push to main by itself.
  gate:
    needs: check
    if: needs.check.outputs.publish == 'true' || github.event_name != 'push'
    uses: ./.github/workflows/ci.yml

  # A push that releases nothing skips gate, and so this and the jobs after it.
  build:
    needs: [check, gate]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PUBLISH: ${{ needs.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: false
      # The sdist, then the wheel built from it, into dist/.
      - name: Build
        run: uv build --no-sources
      # PyPI refuses a version it already has, so a tag of one fails here, before anything is uploaded. The wheel's
      # name holds the version as PEP 440 normalizes it, as PyPI has it: 0.3.0rc1 for 0.3.0-rc.1. When PyPI can't be
      # asked, the run goes on with a warning: PyPI would refuse the upload of a version it has, overwriting nothing.
      - name: PyPI doesn't have this version yet
        run: |
          wheels=(dist/*.whl)
          name=${wheels[0]#dist/drivine-}
          normalized=${name%%-*}
          url="https://pypi.org/pypi/drivine/$normalized/json"
          status=$(curl -sL --retry 3 -o /dev/null -w '%{http_code}' "$url" || true)
          if [[ "$status" == 200 ]]; then
            if [[ "$PUBLISH" == true ]]; then
              echo "::error::PyPI already has drivine $normalized, so this run publishes nothing. If merging its version bump released it, and this is a tag pushed for it by hand afterwards, there is nothing left to do. Otherwise bump the version in a release PR."
              exit 1
            fi
            echo "::warning::PyPI already has drivine $normalized. This dry run goes on, but a tag of it would fail."
          elif [[ "$status" != 404 ]]; then
            echo "::warning::Couldn't ask PyPI whether it has drivine $normalized (HTTP status $status). Going on."
          fi
      - name: Check the distributions
        run: uvx twine check --strict dist/*
      # The wheel, installed into a clean environment on the oldest and the newest Python drivine supports, imports
      # and writes typed references with python -m drivine.stubs.
      - name: Smoke test the wheel on Python 3.11
        run: uv run --no-project --python 3.11 python scripts/smoke_wheel.py dist/*.whl
      - name: Smoke test the wheel on Python 3.14
        run: uv run --no-project --python 3.14 python scripts/smoke_wheel.py dist/*.whl
      - name: List the distributions
        run: |
          echo "drivine $VERSION"
          ls -l dist
          sha256sum dist/*
          unzip -l dist/*.whl
          tar -tzf dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/drivine/${{ needs.check.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Trusted publishing: PyPI trusts this workflow, in the release environment, through OIDC. No token is held.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  github-release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # On a push to main, the tag doesn't exist yet: the release makes it, on the commit this run built. A tag made
      # with GITHUB_TOKEN starts no workflow, so it doesn't run this again. A tag pushed by hand is already there.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag "${prerelease[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes "${prerelease[@]}"
          fi
